<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNMP网络设备监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        .header {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .header h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 2em;
            color: #64b5f6;
            letter-spacing: 2px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }
        
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; animation: pulse 2s infinite;
        }
        .dot-online { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .dot-offline { background: #f44336; box-shadow: 0 0 8px #f44336; }
        
        .controls {
            display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 13px; transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-primary { background: #1976d2; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-danger { background: #c62828; color: white; }
        .btn-warning { background: #ef6c00; color: white; }
        .btn-info { background: #00838f; color: white; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        
        .card h3 {
            color: #64b5f6;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
            font-size: 16px;
        }
        
        .metric {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; padding: 8px;
            background: rgba(255,255,255,0.03); border-radius: 8px;
        }
        
        .metric-value { font-weight: bold; font-size: 1.1em; color: #90caf9; }
        
        .chart-container { height: 280px; margin-top: 10px; }
        
        /* Interface Table Styles */
        .interface-toolbar {
            display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap;
        }
        .search-box {
            flex: 1; min-width: 200px; padding: 8px 14px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); color: #e0e0e0; font-size: 14px;
            outline: none;
        }
        .search-box:focus { border-color: #64b5f6; }
        .search-box::placeholder { color: rgba(255,255,255,0.3); }
        
        .table-wrapper {
            overflow-x: auto; max-height: 500px; overflow-y: auto;
            border-radius: 10px;
        }
        .table-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        
        .iface-table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        .iface-table thead { position: sticky; top: 0; z-index: 1; }
        .iface-table th {
            background: rgba(25, 118, 210, 0.3); padding: 10px 14px;
            text-align: left; cursor: pointer; user-select: none; white-space: nowrap;
        }
        .iface-table th:hover { background: rgba(25, 118, 210, 0.5); }
        .iface-table th .sort-arrow { margin-left: 4px; font-size: 10px; }
        .iface-table td { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .iface-table tbody tr:hover { background: rgba(255,255,255,0.04); }
        .iface-table tbody tr:last-child td { border-bottom: none; }
        
        .status-badge {
            display: inline-block; padding: 3px 12px; border-radius: 12px;
            font-weight: bold; font-size: 12px; text-transform: uppercase;
        }
        .status-up { background: rgba(76, 175, 80, 0.25); color: #81c784; }
        .status-down { background: rgba(244, 67, 54, 0.25); color: #ef9a9a; }
        
        .result-count { font-size: 13px; color: #90a4ae; margin-left: auto; white-space: nowrap; }
        
        .summary-bar {
            display: flex; gap: 20px; margin-bottom: 12px;
            padding: 10px 16px; background: rgba(255,255,255,0.03); border-radius: 8px;
            font-size: 13px;
        }
        .summary-item strong { color: #64b5f6; }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding: 4px;
        }
        .cards-grid::-webkit-scrollbar { width: 6px; }
        .cards-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        
        .iface-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 16px;
            border-left: 4px solid #4caf50;
            transition: all 0.2s;
            cursor: default;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .iface-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); }
        .iface-card.card-down { border-left-color: #f44336; }
        .iface-card .card-name {
            font-weight: bold;
            font-size: 14px;
            color: #e0e0e0;
            word-break: break-all;
        }
        .iface-card .card-speed {
            font-size: 12px;
            color: #90a4ae;
        }
        .iface-card .card-status {
            align-self: flex-end;
        }
        
        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
        }
        
        .loading { text-align: center; padding: 20px; color: #90a4ae; }
        
        .error {
            background: rgba(244, 67, 54, 0.2); color: #ef9a9a;
            padding: 10px 16px; border-radius: 8px; margin: 10px 0; font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .status-bar { flex-direction: column; align-items: flex-start; }
            .controls { flex-direction: column; }
            .interface-toolbar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部状态栏 -->
        <div class="header">
            <h1>SNMP 网络设备监控系统</h1>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="pingDot"></div>
                    <span>设备: <strong id="deviceStatus">检测中...</strong></span>
                </div>
                <div class="status-item">
                    <span>IP: <strong style="color:#64b5f6">172.16.100.100</strong></span>
                </div>
                <div class="status-item">
                    <span>名称: <strong id="deviceModel">检测中...</strong></span>
                </div>
                <div class="status-item">
                    <span>运行: <strong id="uptime">检测中...</strong></span>
                </div>
                <div class="status-item">
                    <span>常规(60s): <strong id="generalRefresh" style="color:#64b5f6">--:--:--</strong></span>
                </div>
                <div class="status-item">
                    <span>接口(300s): <strong id="ifaceRefresh" style="color:#ffab40">--:--:--</strong></span>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshData()">刷新数据</button>
                <button class="btn btn-success" onclick="pingTest()">Ping 测试</button>
                <button class="btn btn-info" onclick="toggleInterfaceView()" id="viewToggleBtn">切换到表格</button>
                <button class="btn btn-warning" onclick="toggleHistory()">历史记录</button>
                <button class="btn btn-danger" onclick="clearHistory()">清除历史</button>
            </div>
        </div>
        
        <!-- 仪表盘 -->
        <div class="dashboard">
            <div class="card">
                <h3>CPU 使用率</h3>
                <div class="metric">
                    <span>当前使用率:</span>
                    <span class="metric-value" id="cpuUsage">0%</span>
                </div>
                <div class="chart-container"><canvas id="cpuChart"></canvas></div>
            </div>
            <div class="card">
                <h3>内存使用率</h3>
                <div class="metric">
                    <span>当前使用率:</span>
                    <span class="metric-value" id="memoryUsage">0%</span>
                </div>
                <div class="chart-container"><canvas id="memoryChart"></canvas></div>
            </div>
            <div class="card">
                <h3>包传输统计</h3>
                <div class="metric">
                    <span>接收包数:</span>
                    <span class="metric-value" id="inPackets">0</span>
                </div>
                <div class="metric">
                    <span>发送包数:</span>
                    <span class="metric-value" id="outPackets">0</span>
                </div>
                <div class="chart-container"><canvas id="packetChart"></canvas></div>
            </div>
        </div>
        
        <!-- 接口状态 (卡片视图 - 默认显示) -->
        <div class="card" id="interfaceCardView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin:0; border:none; padding:0;">网络接口状态</h3>
                <span class="result-count" id="ifaceCountCard"></span>
            </div>
            <div class="summary-bar" id="ifaceSummaryCard"></div>
            <div class="interface-toolbar">
                <input type="text" class="search-box" id="ifaceSearch2" placeholder="搜索接口名称..." oninput="filterInterfaces()">
                <button class="btn btn-warning" onclick="toggleInterfaceExpand()" id="expandBtn2" style="white-space:nowrap;">展开全部</button>
            </div>
            <div class="cards-grid" id="interfaceCardsContainer">
                <div class="loading">正在加载接口数据...</div>
            </div>
        </div>
        
        <!-- 接口状态 (表格视图 - 默认隐藏) -->
        <div class="card" id="interfaceTableCard" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin:0; border:none; padding:0;">网络接口状态</h3>
                <span class="result-count" id="ifaceCount"></span>
            </div>
            <div class="summary-bar" id="ifaceSummary"></div>
            <div class="interface-toolbar">
                <input type="text" class="search-box" id="ifaceSearch" placeholder="搜索接口名称..." oninput="filterInterfaces()">
                <button class="btn btn-warning" onclick="toggleInterfaceExpand()" id="expandBtn" style="white-space:nowrap;">展开全部</button>
            </div>
            <div class="table-wrapper" id="tableWrapper">
                <table class="iface-table">
                    <thead>
                        <tr>
                            <th onclick="sortInterfaces('name')">端口名称 <span class="sort-arrow"></span></th>
                            <th onclick="sortInterfaces('speed')">设定速率 <span class="sort-arrow"></span></th>
                            <th onclick="sortInterfaces('status')">接口状态 <span class="sort-arrow"></span></th>
                        </tr>
                    </thead>
                    <tbody id="interfaceTableBody">
                        <tr><td colspan="3" class="loading">正在加载接口数据...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 设备信息 -->
        <div class="card">
            <h3>设备信息</h3>
            <div id="deviceInfo"><div class="loading">加载设备信息中...</div></div>
        </div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        let cpuChart, memoryChart, packetChart;
        let showAllHistory = false;
        let showAllInterfaces = false;
        let useCardView = true;
        let allInterfaces = {};
        let filteredInterfaces = {};
        let sortColumn = 'name';
        let sortAsc = true;
        
        // ==================== 图表初始化 ====================
        function initCharts() {
            const chartOpts = (label, color, max) => ({
                type: 'line',
                data: { labels: [], datasets: [{
                    label, data: [],
                    borderColor: color,
                    backgroundColor: color.replace(')', ',0.1)').replace('rgb', 'rgba'),
                    borderWidth: 2, fill: true, tension: 0.4,
                    pointRadius: 4, pointHoverRadius: 7,
                    pointBackgroundColor: color, pointBorderColor: '#fff', pointBorderWidth: 1
                }]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 300 },
                    plugins: { legend: { labels: { color: '#90a4ae', font: { size: 11 } } } },
                    scales: {
                        x: { ticks: { color: '#90a4ae', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ...(max ? { beginAtZero: true, max } : {}),
                             ticks: { color: '#90a4ae', font: { size: 10 }, callback: v => v + (max ? '%' : '') },
                             grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
            
            cpuChart = new Chart(document.getElementById('cpuChart').getContext('2d'), chartOpts('CPU使用率 (%)', 'rgb(66, 165, 245)', 100));
            memoryChart = new Chart(document.getElementById('memoryChart').getContext('2d'), chartOpts('内存使用率 (%)', 'rgb(171, 71, 188)', 100));
            packetChart = new Chart(document.getElementById('packetChart').getContext('2d'), {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: '接收包数', data: [], borderColor: 'rgb(76, 175, 80)', backgroundColor: 'rgba(76,175,80,0.1)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 7, pointBackgroundColor: 'rgb(76, 175, 80)', pointBorderColor: '#fff', pointBorderWidth: 1 },
                    { label: '发送包数', data: [], borderColor: 'rgb(244, 67, 54)', backgroundColor: 'rgba(244,67,54,0.1)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 7, pointBackgroundColor: 'rgb(244, 67, 54)', pointBorderColor: '#fff', pointBorderWidth: 1 }
                ]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 300 },
                    plugins: { legend: { labels: { color: '#90a4ae', font: { size: 11 } } } },
                    scales: {
                        x: { ticks: { color: '#90a4ae', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#90a4ae', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
        
        function updateChart(chart, labels, datasets) {
            chart.data.labels = labels;
            datasets.forEach((data, i) => { if (chart.data.datasets[i]) chart.data.datasets[i].data = data; });
            chart.update('none');
        }
        
        // ==================== 数据获取 ====================
        async function fetchCurrentData() {
            try {
                const res = await fetch('/api/current_data');
                const result = await res.json();
                if (result.success) {
                    updateUI(result.data, result);
                } else {
                    showError('获取数据失败: ' + result.error);
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            }
        }
        
        async function fetchHistoryData(showAll = false) {
            try {
                const url = showAll ? '/api/history_data?show_all=true' : '/api/history_data';
                const res = await fetch(url);
                const result = await res.json();
                if (result.success) {
                    const h = result.history;
                    if (h.cpu && h.cpu.length) updateChart(cpuChart, h.cpu.map(i => i.time), [h.cpu.map(i => i.usage)]);
                    if (h.memory && h.memory.length) updateChart(memoryChart, h.memory.map(i => i.time), [h.memory.map(i => i.usage)]);
                    if (h.packets && h.packets.length) updateChart(packetChart, h.packets.map(i => i.time), [h.packets.map(i => i.in_packets), h.packets.map(i => i.out_packets)]);
                    showAllHistory = result.show_all;
                    document.querySelector('button.btn-warning').textContent = showAllHistory ? '显示最近' : '历史记录';
                }
            } catch (e) { console.error('获取历史数据失败:', e); }
        }
        
        // ==================== UI更新 ====================
        function updateUI(data, result) {
            // 设备状态
            const dot = document.getElementById('pingDot'), dev = document.getElementById('deviceStatus');
            if (data.ping.status === '在线') {
                dot.className = 'status-dot dot-online'; dev.textContent = '在线'; dev.style.color = '#81c784';
            } else {
                dot.className = 'status-dot dot-offline'; dev.textContent = data.ping.status; dev.style.color = '#ef9a9a';
            }
            
            document.getElementById('deviceModel').textContent = data.device_info.sys_name || '未知';
            document.getElementById('uptime').textContent = data.uptime;
            document.getElementById('cpuUsage').textContent = (data.cpu_usage != null ? data.cpu_usage + '%' : 'N/A');
            document.getElementById('memoryUsage').textContent = (data.memory_usage != null ? data.memory_usage + '%' : 'N/A');
            document.getElementById('inPackets').textContent = (data.packet_rates.in_packets || 0).toLocaleString();
            document.getElementById('outPackets').textContent = (data.packet_rates.out_packets || 0).toLocaleString();
            
            // 刷新时间
            if (result) {
                const genTime = result.general_refresh ? result.general_refresh.split(' ')[1] : '--:--:--';
                const ifaceTime = result.interfaces_refresh ? result.interfaces_refresh.split(' ')[1] : '--:--:--';
                document.getElementById('generalRefresh').textContent = genTime;
                document.getElementById('ifaceRefresh').textContent = ifaceTime;
            }
            
            // 接口
            allInterfaces = data.interfaces || {};
            renderInterfaces();
            updateDeviceInfo(data.device_info);
        }
        
        function updateDeviceInfo(info) {
            const items = [
                ['系统描述', info.sys_descr],
                ['设备名称', info.sys_name],
                ['设备位置', info.sys_location],
                ['联系人', info.sys_contact]
            ];
            document.getElementById('deviceInfo').innerHTML = items.map(([l, v]) =>
                `<div class="metric"><span>${l}:</span><span class="metric-value">${v || '未知'}</span></div>`
            ).join('');
        }
        
        // ==================== 接口渲染 ====================
        function renderInterfaces() {
            applyFilterAndSort();
            const ifaces = filteredInterfaces;
            const entries = Object.entries(ifaces);
            
            // 统计
            const total = Object.keys(allInterfaces).length;
            const upCount = Object.values(allInterfaces).filter(i => i.status === 'Up').length;
            const downCount = total - upCount;
            
            // 更新表格视图的统计
            document.getElementById('ifaceCount').textContent = `共 ${total} 个接口`;
            document.getElementById('ifaceSummary').innerHTML = summaryHTML(total, upCount, downCount, entries.length);
            
            // 更新卡片视图的统计
            document.getElementById('ifaceCountCard').textContent = `共 ${total} 个接口`;
            document.getElementById('ifaceSummaryCard').innerHTML = summaryHTML(total, upCount, downCount, entries.length);
            
            // 表格视图
            renderInterfaceTable(entries);
            // 卡片视图
            renderInterfaceCards(entries);
            
            // 展开按钮
            const btnText = showAllInterfaces ? '收起' : '展开全部';
            document.getElementById('expandBtn').textContent = btnText;
            document.getElementById('expandBtn2').textContent = btnText;
        }
        
        function summaryHTML(total, upCount, downCount, filtered) {
            return `
                <span class="summary-item">总计: <strong>${total}</strong></span>
                <span class="summary-item">Up: <strong style="color:#81c784">${upCount}</strong></span>
                <span class="summary-item">Down: <strong style="color:#ef9a9a">${downCount}</strong></span>
                <span class="summary-item" style="margin-left:auto">筛选显示: <strong>${filtered}</strong></span>
            `;
        }
        
        function renderInterfaceTable(entries) {
            const displayEntries = showAllInterfaces ? entries : entries.slice(0, 10);
            const tbody = document.getElementById('interfaceTableBody');
            
            if (displayEntries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#90a4ae;padding:20px;">无匹配的接口数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = displayEntries.map(([name, info]) => {
                const sc = info.status === 'Up' ? 'status-up' : 'status-down';
                return `<tr>
                    <td><strong>${name}</strong></td>
                    <td>${info.speed || '未知'}</td>
                    <td><span class="status-badge ${sc}">${info.status}</span></td>
                </tr>`;
            }).join('');
            
            if (!showAllInterfaces && entries.length > 10) {
                tbody.innerHTML += `<tr><td colspan="3" style="text-align:center;color:#ffab40;padding:10px;background:rgba(255,171,64,0.05);">
                    还有 ${entries.length - 10} 个接口未显示，点击"展开全部"查看
                </td></tr>`;
            }
        }
        
        function renderInterfaceCards(entries) {
            const container = document.getElementById('interfaceCardsContainer');
            const displayEntries = showAllInterfaces ? entries : entries.slice(0, 30);
            
            if (displayEntries.length === 0) {
                container.innerHTML = '<div class="loading">无匹配的接口数据</div>';
                return;
            }
            
            let html = displayEntries.map(([name, info]) => {
                const isUp = info.status === 'Up';
                const sc = isUp ? 'status-up' : 'status-down';
                const dc = isUp ? '' : ' card-down';
                return `<div class="iface-card${dc}">
                    <div class="card-name" title="${name}">${name}</div>
                    <div class="card-speed">速率: ${info.speed || '未知'}</div>
                    <div class="card-status"><span class="status-badge ${sc}">${info.status}</span></div>
                </div>`;
            }).join('');
            
            if (!showAllInterfaces && entries.length > 30) {
                html += `<div style="grid-column:1/-1;text-align:center;color:#ffab40;padding:14px;background:rgba(255,171,64,0.06);border-radius:10px;">
                    还有 ${entries.length - 30} 个接口未显示，点击"展开全部"查看
                </div>`;
            }
            
            container.innerHTML = html;
        }
        
        function applyFilterAndSort() {
            const searchEl = useCardView
                ? document.getElementById('ifaceSearch2')
                : document.getElementById('ifaceSearch');
            const searchTerm = (searchEl.value || '').toLowerCase();
            let entries = Object.entries(allInterfaces);
            
            // 过滤
            if (searchTerm) {
                entries = entries.filter(([name]) => name.toLowerCase().includes(searchTerm));
            }
            
            // 排序
            entries.sort((a, b) => {
                let va, vb;
                switch (sortColumn) {
                    case 'name': va = a[0]; vb = b[0]; break;
                    case 'speed':
                        va = parseSpeed(a[1].speed); vb = parseSpeed(b[1].speed); break;
                    case 'status': va = a[1].status; vb = b[1].status; break;
                    default: va = a[0]; vb = b[0];
                }
                const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
                return sortAsc ? cmp : -cmp;
            });
            
            filteredInterfaces = Object.fromEntries(entries);
        }
        
        function parseSpeed(s) {
            if (!s) return 0;
            const m = s.match(/^([\d.]+)\s*(Gbps|Mbps|Kbps|bps)/);
            if (!m) return 0;
            const mult = { bps: 1, Kbps: 1e3, Mbps: 1e6, Gbps: 1e9 };
            return parseFloat(m[1]) * (mult[m[2]] || 1);
        }
        
        function filterInterfaces() {
            // 同步两个搜索框
            const s1 = document.getElementById('ifaceSearch');
            const s2 = document.getElementById('ifaceSearch2');
            if (useCardView) {
                if (document.activeElement === s2) s1.value = s2.value;
            } else {
                if (document.activeElement === s1) s2.value = s1.value;
            }
            renderInterfaces();
        }
        
        function sortInterfaces(col) {
            if (sortColumn === col) sortAsc = !sortAsc;
            else { sortColumn = col; sortAsc = true; }
            
            // 更新表头箭头
            document.querySelectorAll('.iface-table th .sort-arrow').forEach(a => a.textContent = '');
            const ths = document.querySelectorAll('.iface-table th');
            const idx = ['name','speed','status'].indexOf(col);
            if (idx >= 0) ths[idx].querySelector('.sort-arrow').textContent = sortAsc ? '▲' : '▼';
            
            renderInterfaces();
        }
        
        function toggleInterfaceExpand() {
            showAllInterfaces = !showAllInterfaces;
            renderInterfaces();
        }
        
        function toggleInterfaceView() {
            useCardView = !useCardView;
            document.getElementById('interfaceTableCard').style.display = useCardView ? 'none' : '';
            document.getElementById('interfaceCardView').style.display = useCardView ? '' : 'none';
            document.getElementById('viewToggleBtn').textContent = useCardView ? '切换到表格' : '切换到卡片';
            if (!useCardView) {
                // 切换到表格时，同步搜索框、排序信息并重新渲染
                document.getElementById('ifaceSearch').value = document.getElementById('ifaceSearch2').value;
            }
            // 非全量刷新，直接重渲染当前数据
            applyFilterAndSort();
            const entries = Object.entries(filteredInterfaces);
            if (useCardView) {
                renderInterfaceCards(entries);
            } else {
                renderInterfaceTable(entries);
            }
        }
        
        // ==================== 操作 ====================
        function showError(msg) {
            const div = document.createElement('div');
            div.className = 'error'; div.textContent = msg;
            document.querySelector('.header').appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }
        
        async function refreshData() {
            await fetchCurrentData();
            await fetchHistoryData(showAllHistory);
        }
        
        async function pingTest() {
            try {
                const res = await fetch('/api/ping_test');
                const result = await res.json();
                alert(result.success
                    ? `Ping测试:\n状态: ${result.ping.status}\n响应时间: ${result.ping.response_time || 'N/A'} ms`
                    : 'Ping测试失败: ' + result.error);
            } catch (e) { alert('Ping测试错误: ' + e.message); }
        }
        
        async function toggleHistory() { await fetchHistoryData(!showAllHistory); }
        
        async function clearHistory() {
            if (!confirm('确定要清除所有历史数据吗？')) return;
            try {
                const res = await fetch('/api/clear_history');
                if ((await res.json()).success) {
                    [cpuChart, memoryChart, packetChart].forEach(c => { c.data.labels = []; c.data.datasets.forEach(d => d.data = []); c.update(); });
                    alert('历史数据已清除');
                }
            } catch (e) { alert('清除失败: ' + e.message); }
        }
        
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            refreshData();
            setInterval(refreshData, 10000);
        });
    </script>
</body>
</html>
