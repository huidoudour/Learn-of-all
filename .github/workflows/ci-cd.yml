name: CI/CD Pipeline

on:
  push:
    branches: ['**']  # 监控所有分支的推送

jobs:
  # Job 1: Java 编译任务 - 检测 Java 文件变化并编译
  java-build:
    name: Java Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # 获取最近两次提交以进行比对

      - name: Check for Java file changes
        id: check-changes
        run: |
          echo "Checking for Java file changes..."
          
          # 验证 before commit 是否存在（处理强制推送情况）
          BEFORE_COMMIT="${{ github.event.before }}"
          CURRENT_COMMIT="${{ github.sha }}"
          
          if [ "$BEFORE_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            # 首次提交，检查所有文件
            echo "First commit detected, checking all files..."
            CHANGED_FILES=$(git ls-tree -r --name-only HEAD || true)
          elif git cat-file -e "$BEFORE_COMMIT" 2>/dev/null; then
            # before commit 存在，正常比对
            echo "Comparing $BEFORE_COMMIT to $CURRENT_COMMIT..."
            CHANGED_FILES=$(git diff --name-only "$BEFORE_COMMIT" "$CURRENT_COMMIT" || true)
          else
            # before commit 不存在（强制推送），回退到 HEAD~1
            echo "Before commit not found (force push detected), falling back to HEAD~1..."
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)
            else
              # 只有一个 commit，列出所有文件
              echo "Only one commit exists, listing all files..."
              CHANGED_FILES=$(git ls-tree -r --name-only HEAD || true)
            fi
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # 检查是否有 .java 或 pom.xml 文件变更
          JAVA_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '\.java$|pom\.xml$'; then
            JAVA_CHANGED=true
            echo "Java files or pom.xml changed!"
          fi
          
          echo "java_changed=$JAVA_CHANGED" >> $GITHUB_OUTPUT

      - name: Setup JDK
        if: steps.check-changes.outputs.java_changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Java modules
        if: steps.check-changes.outputs.java_changed == 'true'
        continue-on-error: true  # 编译失败不影响工作流继续
        run: |
          echo "Starting Java compilation..."
          
          # 查找所有包含 pom.xml 的目录并编译
          FAILED_MODULES=""
          SUCCESS_MODULES=""
          
          # 编译 spring-demo
          if [ -d "Java/SpringIOC容器/spring-demo" ]; then
            echo "Compiling spring-demo..."
            cd Java/SpringIOC容器/spring-demo
            if mvn clean compile -q; then
              SUCCESS_MODULES="$SUCCESS_MODULES spring-demo"
            else
              FAILED_MODULES="$FAILED_MODULES spring-demo"
            fi
            cd ../../..
          fi
          
          # 编译 zms-spring
          if [ -d "Java/SpringIOC容器/zms-spring" ]; then
            echo "Compiling zms-spring..."
            cd Java/SpringIOC容器/zms-spring
            if mvn clean compile -q; then
              SUCCESS_MODULES="$SUCCESS_MODULES zms-spring"
            else
              FAILED_MODULES="$FAILED_MODULES zms-spring"
            fi
            cd ../../..
          fi
          
          # 编译 juc-demo
          if [ -d "Java/concurrent-programming/juc-demo" ]; then
            echo "Compiling juc-demo..."
            cd Java/concurrent-programming/juc-demo
            if mvn clean compile -q; then
              SUCCESS_MODULES="$SUCCESS_MODULES juc-demo"
            else
              FAILED_MODULES="$FAILED_MODULES juc-demo"
            fi
            cd ../..
          fi
          
          # 编译 design-pattern
          if [ -d "Java/design-pattern-code/design-pattern" ]; then
            echo "Compiling design-pattern..."
            cd Java/design-pattern-code/design-pattern
            if mvn clean compile -q; then
              SUCCESS_MODULES="$SUCCESS_MODULES design-pattern"
            else
              FAILED_MODULES="$FAILED_MODULES design-pattern"
            fi
            cd ../..
          fi
          
          echo ""
          echo "===== Compilation Summary ====="
          echo "Successful modules:$SUCCESS_MODULES"
          if [ -n "$FAILED_MODULES" ]; then
            echo "Failed modules:$FAILED_MODULES"
          else
            echo "All modules compiled successfully!"
          fi
          echo "================================="

      - name: Compile standalone Java files
        if: steps.check-changes.outputs.java_changed == 'true'
        continue-on-error: true
        run: |
          echo "Searching for standalone Java files (no pom.xml in ancestor dirs)..."

          # 找到所有 .java 文件，排除 Maven 项目内的（祖先目录有 pom.xml）
          find Java -name "*.java" -type f > /tmp/all_java_files.txt

          > /tmp/standalone_java_files.txt
          while read -r java_file; do
            dir=$(dirname "$java_file")
            check_dir="$dir"
            has_pom=false
            while [ "$check_dir" != "Java" ] && [ "$check_dir" != "." ]; do
              if [ -f "$check_dir/pom.xml" ]; then
                has_pom=true
                break
              fi
              check_dir=$(dirname "$check_dir")
            done
            if [ "$has_pom" = false ]; then
              echo "$java_file" >> /tmp/standalone_java_files.txt
            fi
          done < /tmp/all_java_files.txt

          if [ -s /tmp/standalone_java_files.txt ]; then
            echo "Found standalone Java files:"
            cat /tmp/standalone_java_files.txt
            echo ""

            FAILED_FILES=""
            SUCCESS_FILES=""
            while read -r java_file; do
              file_dir=$(dirname "$java_file")
              echo "Compiling: $java_file"
              if javac -d "$file_dir" "$java_file" 2>&1; then
                SUCCESS_FILES="$SUCCESS_FILES
              - $java_file"
              else
                FAILED_FILES="$FAILED_FILES
              - $java_file"
              fi
            done < /tmp/standalone_java_files.txt

            echo ""
            echo "===== Standalone Compilation Summary ====="
            echo "Successful:$SUCCESS_FILES"
            if [ -n "$FAILED_FILES" ]; then
              echo "Failed:$FAILED_FILES"
            else
              echo "All standalone files compiled successfully!"
            fi
          else
            echo "No standalone Java files found."
          fi
          echo "==========================================="

      - name: Package compiled artifacts
        if: steps.check-changes.outputs.java_changed == 'true'
        continue-on-error: true
        run: |
          echo "Packaging compiled Java artifacts..."
          
          # 创建打包目录
          mkdir -p java-build-output
          
          # 复制所有 target 目录（Maven 编译产物）
          find Java -type d -name "target" -exec cp -r {} java-build-output/ \; 2>/dev/null || true

          # 收集独立 .class 文件（非 target 目录内的，即 javac 编译产物）
          echo "Collecting standalone .class files..."
          find Java -name "*.class" -type f | while read -r class_file; do
            # 跳过 target 目录内的（已在上一步复制）
            case "$class_file" in
              */target/*) continue ;;
            esac
            dest="java-build-output/$(dirname "$class_file")"
            mkdir -p "$dest"
            cp "$class_file" "$dest/"
            echo "  Packaged: $class_file"
          done
          
          # 如果没有任何编译产物，创建一个说明文件
          if [ ! -d "java-build-output/target" ] && ! find java-build-output -name "*.class" -type f | grep -q .; then
            echo "No compiled artifacts found (compilation may have failed or no Java changes)" > java-build-output/BUILD_INFO.txt
            echo "Build time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> java-build-output/BUILD_INFO.txt
          fi
          
          # 直接上传目录，GitHub Actions 会自动打包（避免双重 zip）
          echo "Ready to upload java-build-output/"

      - name: Upload Java build artifacts
        if: steps.check-changes.outputs.java_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: java-build-output
          path: java-build-output/
          retention-days: 7

  # Job 2: 代码打包任务 - 打包所有代码文件
  code-package:
    name: Code Package
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get commit information
        id: commit-info
        run: |
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "commit_message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Prepare code package
        run: |
          echo "Preparing code package..."
          
          # 创建 staging 目录
          STAGING="code-package-output"
          mkdir -p "$STAGING"
          
          # 复制所有文件（排除 .git 目录和自身 staging 目录）
          rsync -a --exclude='.git' --exclude='.gitignore' --exclude="$STAGING" ./ "$STAGING/"
          
          # 创建打包信息文件
          echo "Learn-of-all Project Package" > "$STAGING/PACKAGING_INFO.txt"
          echo "============================" >> "$STAGING/PACKAGING_INFO.txt"
          echo "Branch: ${{ steps.commit-info.outputs.branch }}" >> "$STAGING/PACKAGING_INFO.txt"
          echo "Commit: ${{ steps.commit-info.outputs.commit_sha }}" >> "$STAGING/PACKAGING_INFO.txt"
          echo "Message: ${{ steps.commit-info.outputs.commit_message }}" >> "$STAGING/PACKAGING_INFO.txt"
          echo "Author: ${{ steps.commit-info.outputs.author }}" >> "$STAGING/PACKAGING_INFO.txt"
          echo "Timestamp: ${{ steps.commit-info.outputs.timestamp }} (UTC)" >> "$STAGING/PACKAGING_INFO.txt"
          echo "" >> "$STAGING/PACKAGING_INFO.txt"
          echo "This package contains all project files excluding .git directory." >> "$STAGING/PACKAGING_INFO.txt"
          echo "Generated by GitHub Actions CI/CD Pipeline." >> "$STAGING/PACKAGING_INFO.txt"
          
          echo "Staging directory ready: $STAGING"
          du -sh "$STAGING"

      - name: Upload code package artifact
        uses: actions/upload-artifact@v6
        with:
          name: auto-pack
          path: code-package-output/
          retention-days: 30
